name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Force bundled Node 20 actions (e.g. github-script inside
# codecov-action@v5) onto Node 24 ahead of GitHub's 2026-06-16 cutover.
# Belt-and-suspenders to the orion runner's /home/runner/.env (spore-host#345);
# this also covers GitHub-hosted fallback runs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          cache: true
      # Formatting gate (#26). Runs first because it's the cheapest check and the
      # fastest to act on. Nothing checked formatting before — this repo has no
      # Makefile, so there wasn't even a local `fmt` target anyone might run. The
      # tree happened to be clean when this landed; the gate is what keeps it
      # that way (the siblings drifted for months without one — spawn#484 had 3
      # files unformatted, truffle#122 had 7).
      #
      # The key property is that it REPORTS rather than fixes: `gofmt -w`
      # rewrites files and exits 0, so a gate built on it could only ever report
      # success. gofmt walks paths rather than modules, so this covers everything.
      - name: Format gate
        run: |
          files=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$files" ]; then
            echo "::error::these files are not gofmt-clean — run 'gofmt -w' on them:"
            echo "$files" | sed 's/^/  /'
            gofmt -d $files
            exit 1
          fi
          echo "✓ gofmt clean"

      - name: Build
        run: go build ./...
      - name: Test
        run: go test -coverprofile=coverage.out ./...
      - name: Coverage gate
        env:
          # Ratchet floor — must not drop below this. Raise it as coverage
          # improves; target is 60% (see CLAUDE.md). Current: ~12.2%.
          MIN_COVERAGE: '10'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}% (floor: ${MIN_COVERAGE}%)"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t+0 >= m+0) }' \
            || { echo "::error::coverage ${total}% is below floor ${MIN_COVERAGE}%"; exit 1; }
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage.out
          fail_ci_if_error: false
      - name: Vet
        run: go vet ./...
